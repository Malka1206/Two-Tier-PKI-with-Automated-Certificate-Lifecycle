# =============================================================================
# Nginx mutual-TLS service (README section 6)
#
# The certificate paths below (/etc/nginx/certs) are the ones given in the
# README. `make up` copies the PKI files to pki/nginx/certs and rewrites this
# prefix to that directory before starting Nginx.
# The relative paths (logs/...) are relative to the Nginx prefix (-p).
# =============================================================================
worker_processes  1;
pid               logs/nginx.pid;
error_log         logs/error.log;

events {
    worker_connections  64;
}

http {
    access_log  logs/access.log;

    server {
        listen 8443 ssl;
        server_name web.lab.local;

        ssl_certificate         /etc/nginx/certs/server.crt;       # leaf + intermediate
        ssl_certificate_key     /etc/nginx/certs/server.key;

        ssl_client_certificate  /etc/nginx/certs/ca-chain.crt;     # trust chain for clients
        ssl_verify_client       on;
        ssl_verify_depth        2;
        ssl_crl                 /etc/nginx/certs/crl-chain.pem;    # intermediate + root CRLs

        ssl_protocols           TLSv1.2 TLSv1.3;

        location / {
            return 200 "Hello $ssl_client_s_dn - mTLS OK\n";
        }
    }
}
